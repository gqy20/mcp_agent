[project]
name = "batch-mcp"
version = "0.1.0"
description = "动态 MCP 工具部署和测试框架"
authors = [{name = "AI Assistant", email = "ai@example.com"}]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "agentscope>=1.0.9",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "asyncio-mqtt>=0.16.0",
    "openai>=1.0.0",
    "flask>=3.1.1",
    "flask-cors>=6.0.1",
    "supabase>=2.0.0",
    "psutil>=5.9.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.4.3",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pillow>=11.3.0",
    "ruff>=0.14.9",
    "types-requests>=2.32.4.20250913",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.6.0",
    "isort>=5.12.0"
]

test = [
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.0"
]

[project.scripts]
batch-mcp = "batch_mcp.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src.batch_mcp"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.6.0",
    "isort>=5.12.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.3.0",
    "pre-commit>=4.3.0",
    "bandit>=1.9.2",
    "safety>=3.7.0",
]

[tool.ruff.format]
quote-style = "preserve"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true
allow_any_generics = true
allow_untyped_defs = true
allow_incomplete_defs = true
disable_error_code = [
    "attr-defined",
    "no-any-return",
    "no-untyped-def",
    "var-annotated",
    "assignment",
    "arg-type",
    "call-overload",
    "unreachable",
    "index",
    "operator",
    "misc",
    "no-redef",
    "return",
    "call-arg"
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "__pycache__",
    ".git",
    ".venv",
    ".mypy_cache",
]

[tool.ruff.lint]
# 启用所有规则，然后配置忽略
select = ["ALL"]
ignore = [
    # 行长度（由 ruff format 处理）
    "E501",

    # 与 ruff format 冲突的规则
    "COM812",  # 尾随逗号（由formatter处理）

    # 类型注解相关
    "ANN401",  # 允许 Any 类型
    "ANN101",  # 不要求 self 类型注解
    "ANN102",  # 不要求 cls 类型注解

    # 中文标点符号
    "RUF001",  # 全角标点符号
    "RUF002",  # 文档字符串中的全角逗号
    "RUF003",  # 注释中的全角逗号
    "RUF005",  # 全角冒号


    # 复杂度过高（可选）
    "C901",    # 复杂度过高的函数

    # 过于严格的规则
    "TRY003",  # 要求异常消息变量化
    "EM102",   # 要求 f-string 替代 % 格式化
    "FBT001",  # 布尔类型的位置参数
    "FBT002",  # 布尔类型的默认值
    "B008",    # 函数调用中的参数默认值
]

[tool.ruff.lint.per-file-ignores]
# 测试文件的特殊规则
"tests/**" = [
    "ANN",     # 测试文件不需要严格的类型注解
    "S101",    # 允许使用 assert
    "ARG001",  # 允许未使用的函数参数
    "PLR2004", # 允许魔术数字
]

# 脚本文件的特殊规则
"scripts/**" = [
    "ANN",     # 脚本文件不需要严格的类型注解
    "S101",    # 允许使用 assert
]

# evaluator 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/core/evaluator/**" = [
    "ANN",     # 允许缺失类型注解
    "RUF022",  # 允许 __all__ 未排序
    "BLE001",   # 允许捕获宽泛异常
    "PLC0415", # 允许 import 不在顶层
    "D205",    # 允许文档字符串格式
]

# deployer 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/core/deployer/**" = [
    "ANN",     # 允许缺失类型注解
    "D107",    # 允许 __init__ 缺少 docstring
    "BLE001",  # 允许捕获宽泛异常
    "PLR2004", # 允许魔术数字
    "S110",    # 允许 try-except-pass
]

# processor 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/core/processor/**" = [
    "ANN",     # 允许缺失类型注解
    "BLE001",  # 允许捕获宽泛异常
    "PLR2004", # 允许魔术数字
    "S110",    # 允许 try-except-pass
    "D103",    # 允许缺少函数 docstring
    "D105",    # 允许魔术方法缺少 docstring
    "D107",    # 允许 __init__ 缺少 docstring
    "ASYNC109", # 允许 async 函数使用 timeout 参数
    "ASYNC230", # 允许 async 函数使用 blocking I/O
    "DTZ005",  # 允许 datetime.now() 不带时区参数
    "TRY301",  # 允许在 try 块中 raise
    "TRY300",  # 允许在 try 块中返回
    "ARG002",  # 允许未使用的函数参数
    "PLW0603", # 允许使用 global 语句
    "PLC0415", # 允许 import 不在顶层
    "PTH123",  # 允许使用 open() 而非 Path.open()
    "PERF401", # 允许不使用列表推导式
    "F841",    # 允许已赋值但未使用的变量
]

# cli_handlers 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/core/cli_handlers/**" = [
    "ANN",     # 允许缺失类型注解
    "BLE001",  # 允许捕获宽泛异常
    "S110",    # 允许 try-except-pass
    "PLC0415", # 允许 import 不在顶层
    "ERA001",  # 允许注释代码
    "TRY300",  # 允许在 try 块中返回
    "SLF001",  # 允许访问私有成员
    "PLR0913", # 允许函数参数超过5个
    "PLW0603", # 允许使用 global 语句
    "D107",    # 允许 __init__ 缺少 docstring
    "PLR2004", # 允许魔术数字
    "ARG002",  # 允许未使用的函数参数
]

# analyzer 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/core/analyzer/**" = [
    "ANN",     # 允许缺失类型注解
    "BLE001",  # 允许捕获宽泛异常
    "PLR2004", # 允许魔术数字
    "S110",    # 允许 try-except-pass
    "D107",    # 允许 __init__ 缺少 docstring
    "ARG001",  # 允许未使用的函数参数
    "PERF203", # 允许 try-except 在循环中
    "RUF022",  # 允许 __all__ 未排序
]

# csv_parser 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/utils/csv_parser.py" = [
    "ANN",     # 允许缺失类型注解
    "BLE001",  # 允许捕获宽泛异常
    "PLR2004", # 允许魔术数字
    "D107",    # 允许 __init__ 缺少 docstring
    "D205",    # 允许文档字符串格式
    "PERF401", # 允许不使用列表推导式
    "PLW0603", # 允许使用 global 语句
    "PLC0415", # 允许 import 不在顶层
    "TRY300",  # 允许在 try 块中返回
    "PLR0912", # 允许过多分支
]

# mcp_table_updater 模块的特殊规则（重构期间临时放宽）
"src/batch_mcp/core/mcp_table_updater.py" = [
    "ANN",     # 允许缺失类型注解
    "BLE001",  # 允许捕获宽泛异常
    "S110",    # 允许 try-except-pass
    "PLC0415", # 允许 import 不在顶层
    "PTH123",  # 允许使用 open() 而非 Path.open()
    "TRY300",  # 允许在 try 块中返回
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks as integration tests",
    "unit: marks tests as unit tests"
]
